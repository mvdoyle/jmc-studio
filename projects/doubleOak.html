    <style>
        /* Mobile Menu Styles */
        #mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #FAF9F3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        #mobile-menu.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Mobile menu links animation */
        #mobile-menu ul li {
            transform: translateY(10px);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        
        #mobile-menu.active ul li {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* Staggered animation for menu items */
        #mobile-menu.active ul li:nth-child(1) { transition-delay: 0.1s; }
        #mobile-menu.active ul li:nth-child(2) { transition-delay: 0.2s; }
        #mobile-menu.active ul li:nth-child(3) { transition-delay: 0.3s; }
        #mobile-menu.active ul li:nth-child(4) { transition-delay: 0.4s; }
        
        /* Hamburger Button Styling */
        .mobile-menu-button {
            transition: transform 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px;
            outline: none;
        }
        
        .mobile-menu-button:hover {
            transform: scale(1.1);
        }
        
        /* Hide mobile menu on desktop */
        @media (min-width: 768px) {
            #mobile-menu, .mobile-menu-button {
                display: none !important;
            }
        }
        
        /* Enhanced mobile header positioning */
        @media (max-width: 767px) {
            .header-container {
                position: relative;
            }
            
            .logo-container {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                z-index: 5;
            }
            
            .mobile-menu-btn-container {
                width: 60px;
                height: 60px;
                display: flex;
                align-items: center;
                z-index: 10;
            }
            
            .mobile-balance-container {
                width: 60px; /* Same width as hamburger container */
            }
        }
    </style>
</head>

    <!-- Mobile Menu Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile menu functionality
            const menuButton = document.querySelector('.mobile-menu-button');
            const closeButton = document.querySelector('.mobile-menu-close');
            const mobileMenu = document.getElementById('mobile-menu');
            
            // Open menu
            if (menuButton) {
                menuButton.addEventListener('click', function() {
                    console.log('Menu button clicked');
                    mobileMenu.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            }
            
            // Close menu
            if (closeButton) {
                closeButton.addEventListener('click', function() {
                    console.log('Close button clicked');
                    mobileMenu.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            }
            
            // Close menu when clicking a link
            const mobileMenuLinks = mobileMenu.querySelectorAll('a');
            mobileMenuLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    mobileMenu.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            });
        });
    </script>

    <!-- Custom JavaScript -->
    <script src="../js/main.js"></script>
