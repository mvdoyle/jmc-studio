<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMC Studio | Interior Design</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FAF9F3',
                        olive: '#5A5A4A',
                        sage: '#8A8C7A',
                        charcoal: '#333333'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/page-transitions.css">
    <style>
        /* Mobile Menu Styles */
        #mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #FAF9F3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        #mobile-menu.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Mobile menu links animation */
        #mobile-menu ul li {
            transform: translateY(10px);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        
        #mobile-menu.active ul li {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* Staggered animation for menu items */
        #mobile-menu.active ul li:nth-child(1) { transition-delay: 0.1s; }
        #mobile-menu.active ul li:nth-child(2) { transition-delay: 0.2s; }
        #mobile-menu.active ul li:nth-child(3) { transition-delay: 0.3s; }
        #mobile-menu.active ul li:nth-child(4) { transition-delay: 0.4s; }
        
        /* Hamburger Button Styling */
        .mobile-menu-button {
            transition: transform 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px;
            outline: none;
        }
        
        .mobile-menu-button:hover {
            transform: scale(1.1);
        }
        
        /* Hide mobile menu on desktop */
        @media (min-width: 768px) {
            #mobile-menu, .mobile-menu-button {
                display: none !important;
            }
        }
        
        /* Navigation Spacing and Alignment */
        @media (min-width: 768px) {
            /* Desktop Navigation Alignment */
            header ul:first-of-type {
                display: flex;
                justify-content: flex-end;
                padding-right: 2rem;
            }
            
            header ul:last-of-type {
                display: flex;
                justify-content: flex-start;
                padding-left: 2rem;
            }
        }
        
        /* Ensure logo stays centered on mobile */
        @media (max-width: 767px) {
            .flex.items-center.justify-between {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .text-center.mx-auto {
                flex: 1;
                display: flex;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="bg-cream font-sans text-olive">
    <!-- Intro Animation Overlay -->
    <div id="intro-animation" class="fixed inset-0 bg-cream flex items-center justify-center z-[9999] overflow-hidden">
        <div class="intro-logo-container text-center">
            <!-- Using the new JMC olive logo with transparent background -->
            <img src="images/JMC-olive-no-background.png" alt="JMC Studio" class="intro-logo-image" style="opacity: 1;">
        </div>
    </div>

    <!-- Cookie Consent Banner -->
    <div id="cookie-banner" class="fixed bottom-0 left-0 w-full bg-white p-4 shadow-md z-50 hidden">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center">
            <p class="mb-4 md:mb-0">This site uses cookies. By clicking "Accept", you agree to the storing of cookies on your device.</p>
            <div class="space-x-4">
                <button id="accept-cookies" class="px-4 py-2 bg-olive text-white hover:bg-opacity-90 transition-colors">Accept</button>
                <button id="deny-cookies" class="px-4 py-2 border border-olive text-olive hover:bg-olive hover:bg-opacity-10 transition-colors">Deny</button>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <header class="bg-cream py-3 md:py-6 fixed w-full z-40">
        <nav class="container mx-auto px-6">
            <div class="flex items-center justify-between relative">
                <!-- Hamburger Button (Mobile Only) -->
                <div class="md:hidden flex items-center h-20">
                    <button 
                        class="mobile-menu-button hover:bg-gray-100 active:bg-gray-200 rounded-md transition-colors">
                        <svg class="w-10 h-10 text-olive" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
                
                <!-- Left Navigation Items (Desktop) -->
                <ul class="hidden md:flex space-x-8 uppercase tracking-widest text-sm justify-end w-1/3">
                    <li><a href="about.html" class="hover:text-sage transition-colors duration-300">About</a></li>
                    <li><a href="projects.html" class="hover:text-sage transition-colors duration-300">Selected Projects</a></li>
                </ul>
                
                <!-- Center Logo -->
                <div class="text-center mx-auto w-1/3 flex justify-center">
                    <a href="index.html">
                        <img src="images/jmc-studio-olive-no-background.png" alt="JMC Studio" class="h-20 md:h-28 mx-auto">
                    </a>
                </div>
                
                <!-- Right Navigation Items (Desktop) -->
                <ul class="hidden md:flex space-x-8 uppercase tracking-widest text-sm w-1/3">
                    <li><a href="process.html" class="hover:text-sage transition-colors duration-300">Process</a></li>
                    <li><a href="inquire.html" class="hover:text-sage transition-colors duration-300">Inquire</a></li>
                </ul>
                
                <!-- Empty div for balance (Mobile Only) -->
                <div class="md:hidden w-6"></div>
            </div>
        </nav>
    </header>

    <!-- Mobile Menu (Full Screen Overlay) -->
    <div id="mobile-menu">
        <!-- Close button -->
        <button class="mobile-menu-close hover:bg-gray-100 rounded-md transition-colors" 
                style="background: none; border: none; cursor: pointer; position: absolute; top: 1.5rem; right: 1.5rem; padding: 8px;">
            <svg class="w-8 h-8 text-olive" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    
        <ul class="flex flex-col space-y-8 uppercase tracking-widest text-center">
            <li><a href="about.html" class="block py-3 text-xl hover:text-sage transition-colors duration-300">About</a></li>
            <li><a href="projects.html" class="block py-3 text-xl hover:text-sage transition-colors duration-300">Projects</a></li>
            <li><a href="process.html" class="block py-3 text-xl hover:text-sage transition-colors duration-300">Process</a></li>
            <li><a href="inquire.html" class="block py-3 text-xl hover:text-sage transition-colors duration-300">Inquire</a></li>
        </ul>
    </div>

    <!-- Hero Carousel Section -->
    <section id="hero-carousel" class="w-full h-screen relative overflow-hidden">
        <!-- Carousel Images will be inserted here via JavaScript -->
        <div class="carousel-slides w-full h-full">
            <!-- Images will be dynamically added here -->
        </div>
        
        <!-- Navigation Dots -->
        <div class="absolute bottom-10 left-0 right-0 flex justify-center space-x-3">
            <!-- Dots will be dynamically added here -->
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="bg-olive text-white py-10">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-6 md:mb-0 text-center md:text-left">
                    <img src="images/JMC Studio Small Logo Beige and Charcoal.jpg" alt="JMC Studio" class="h-16 mx-auto md:mx-0 mb-4">
                    <p class="text-sm opacity-80">© 2023 JMC Studio. All rights reserved.</p>
                </div>
                <div class="flex flex-col space-y-2 text-center md:text-right">
                    <a href="#" class="text-sm opacity-80 hover:opacity-100 transition-opacity duration-300">Privacy Policy</a>
                    <a href="#" class="text-sm opacity-80 hover:opacity-100 transition-opacity duration-300">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scroll to Top Button -->
    <button id="scroll-top" class="fixed bottom-6 right-6 bg-olive text-white p-3 rounded-full shadow-lg hidden hover:bg-sage transition-colors duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
    </button>

    <!-- Super simple navigation fix - no dependencies, completely standalone -->
    <script>
        // Mobile Menu
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile menu functionality
            const menuButton = document.querySelector('.mobile-menu-button');
            const closeButton = document.querySelector('.mobile-menu-close');
            const mobileMenu = document.getElementById('mobile-menu');
            
            // Open menu
            if (menuButton) {
                menuButton.addEventListener('click', function() {
                    console.log('Menu button clicked');
                    mobileMenu.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            }
            
            // Close menu
            if (closeButton) {
                closeButton.addEventListener('click', function() {
                    console.log('Close button clicked');
                    mobileMenu.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            }
            
            // Close menu when clicking a link
            const mobileMenuLinks = mobileMenu.querySelectorAll('a');
            mobileMenuLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    mobileMenu.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            });
        });
        
        // Wait for page to fully load
        window.addEventListener('load', function() {
            console.log('SIMPLE navigation fix running');
            
            // First, handle the initial animation on page load
            const introAnimation = document.getElementById('intro-animation');
            if (introAnimation) {
                // Show on initial page load
                if (sessionStorage.getItem('comeFromPage') !== 'true') {
                    // Show animation
                    introAnimation.style.display = 'flex';
                    introAnimation.style.opacity = '1';
                    document.body.style.overflow = 'hidden';
                    
                    // Hide after 2 seconds
                    setTimeout(function() {
                        introAnimation.style.opacity = '0';
                        setTimeout(function() {
                            // Remove from DOM completely instead of just hiding
                            introAnimation.parentNode.removeChild(introAnimation);
                            document.body.style.overflow = 'auto';
                        }, 800);
                    }, 2000);
                } else {
                    // Coming from another page, hide animation
                    introAnimation.style.opacity = '0';
                    // Remove from DOM completely instead of just hiding
                    introAnimation.parentNode.removeChild(introAnimation);
                    document.body.style.overflow = 'auto';
                    sessionStorage.removeItem('comeFromPage');
                }
            }
            
            // SUPER DIRECT approach for navigation
            // About links - IMPORTANT: This must work to navigate to the about page
            var aboutLinks = document.querySelectorAll('a[href="about.html"]');
            aboutLinks.forEach(function(link) {
                // Remove any existing event listeners
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                // Add our navigation handler
                newLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Navigating to About page');
                    goToPage('about.html');
                });
            });
            
            // Projects links
            var projectLinks = document.querySelectorAll('a[href="projects.html"]');
            projectLinks.forEach(function(link) {
                // Remove any existing event listeners
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                // Add our navigation handler
                newLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Navigating to Projects page');
                    goToPage('projects.html');
                });
            });
            
            // Process links
            var processLinks = document.querySelectorAll('a[href="process.html"]');
            processLinks.forEach(function(link) {
                // Remove any existing event listeners
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                // Add our navigation handler
                newLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Navigating to Process page');
                    goToPage('process.html');
                });
            });
            
            // Inquire links
            var inquireLinks = document.querySelectorAll('a[href="inquire.html"]');
            inquireLinks.forEach(function(link) {
                // Remove any existing event listeners
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                // Add our navigation handler
                newLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Navigating to Inquire page');
                    goToPage('inquire.html');
                });
            });
            
            // Home/index links - treat specially since we're already on the home page
            var homeLinks = document.querySelectorAll('a[href="index.html"], a[href="./index.html"], a[href="/"], a[href="./"], a[href="."]');
            homeLinks.forEach(function(link) {
                // Remove any existing event listeners
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                // Add our navigation handler
                newLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Refreshing Home page');
                    // We're already on index, so just refresh
                    window.location.reload();
                });
            });
            
            // Simple function to navigate with animation
            function goToPage(url) {
                // Set flag for next page
                sessionStorage.setItem('comeFromPage', 'true');
                
                // Close mobile menu if it's open
                const mobileMenu = document.getElementById('mobile-menu');
                if (mobileMenu && mobileMenu.classList.contains('active')) {
                    mobileMenu.classList.remove('active');
                }
                
                // Create a new animation overlay since the original might have been removed
                let introAnimation = document.getElementById('intro-animation');
                
                // If the animation element doesn't exist, create it
                if (!introAnimation) {
                    introAnimation = document.createElement('div');
                    introAnimation.id = 'intro-animation';
                    introAnimation.className = 'fixed inset-0 bg-cream flex items-center justify-center z-[9999] overflow-hidden';
                    introAnimation.style.transition = 'opacity 0.8s ease-in-out';
                    
                    // Create logo container
                    const logoContainer = document.createElement('div');
                    logoContainer.className = 'intro-logo-container text-center';
                    
                    // Create logo image
                    const logoImage = document.createElement('img');
                    logoImage.src = 'images/JMC-olive-no-background.png';
                    logoImage.alt = 'JMC Studio';
                    logoImage.className = 'intro-logo-image';
                    logoImage.style.opacity = '1';
                    
                    // Assemble the elements
                    logoContainer.appendChild(logoImage);
                    introAnimation.appendChild(logoContainer);
                    document.body.appendChild(introAnimation);
                }
                
                // Show animation
                introAnimation.style.display = 'flex';
                introAnimation.style.opacity = '0';
                
                // Force reflow
                void introAnimation.offsetWidth;
                
                // Fade in
                introAnimation.style.opacity = '1';
                document.body.style.overflow = 'hidden';
                
                // Navigate after delay
                setTimeout(function() {
                    window.location.href = url;
                }, 800);
            }
        });
    </script>

    <!-- Custom JavaScript -->
    <script src="js/shared.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
